name: Test and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (defaults to the package version)
        required: false

permissions:
  contents: read

concurrency:
  group: release-executables-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: false
          - os: ubuntu-latest
            bundle: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the tagged source
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-v$(node -p "require('./server/package.json').version")}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          git rev-parse --verify "refs/tags/$tag"
          git checkout --detach "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci --no-audit --no-fund
      - run: npm --prefix server test
      - name: Build the Linux executable
        if: matrix.bundle
        run: npm --prefix server run bundle:linux
      - if: matrix.bundle
        run: npm --prefix server run test:bundle
      - name: Hash the Linux executable
        if: matrix.bundle
        shell: bash
        working-directory: dist
        run: sha256sum BetterLanTalk-linux-x64 > BetterLanTalk-linux-x64.sha256
      - if: matrix.bundle
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ runner.os }}
          path: |
            dist/BetterLanTalk-linux-x64
            dist/BetterLanTalk-linux-x64.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: executable-*
          merge-multiple: true
          path: dist
      - name: Check hashes and upload release assets
        shell: bash
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" BetterLanTalk-linux-x64 SHA256SUMS.txt --repo "$RELEASE_REPO" --clobber
      - name: Remove the retired Windows executable and publish
        shell: bash
        run: |
          has_exe="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets --jq 'any(.assets[]; .name == "BetterLanTalk-win-x64.exe")')"
          if [[ "$has_exe" == true ]]; then
            gh release delete-asset "$RELEASE_TAG" BetterLanTalk-win-x64.exe --repo "$RELEASE_REPO" --yes
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --prerelease=false --latest
          fi
