<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BetterLanTalk 内网聊天室</title><link rel="stylesheet" href="/client/admin.css"></head><body><header><a href="/chat">← 返回聊天</a><h1>管理</h1><button onclick="adminAPI.refreshAll()">刷新</button></header><div id="admin-view" class="admin-page" style="flex: 1; overflow-y: auto; padding: 15px; background: #f5f5f5;">
                <section class="admin-section"><h3>极域通知</h3><label><input type="checkbox" id="jiyu-enabled"> 启用通知（仅明确绑定的设备）</label><input type="number" id="jiyu-port" min="1" max="65535" placeholder="UDP 端口"><button onclick="adminAPI.saveJiyu()">保存</button><p class="admin-meta">弹窗只显示 new message / new flie / new picture。UDP 发送完成不代表目标已显示。</p><div id="jiyu-devices"></div></section><div class="admin-section">
                    <h3>📊 服务器状态</h3>
                    <div id="server-status">加载中...</div>
                    <button class="secondary" onclick="adminAPI.loadStatus()">刷新状态</button>
                </div>

                <div class="admin-section">
                    <h3>⚙️ 服务器设置</h3>
                    <div>当前端口: <strong id="current-port">-</strong></div>
                    <input type="number" id="new-port" placeholder="新端口 (1-65535)" style="width: 180px;">
                    <button class="success" onclick="adminAPI.savePort()">保存端口</button>
                    <div class="admin-meta">⚠️ 保存后需重启服务器才能生效</div>
                    <hr style="margin: 10px 0; border: none; border-top: 1px solid #eee;">
                    <div>对外 IP: <strong id="current-server-ip">-</strong> <span class="admin-meta" id="detected-ip"></span></div>
                    <input type="text" id="new-server-ip" placeholder="留空自动检测，如 192.168.1.10" style="width: 220px;">
                    <button class="success" onclick="adminAPI.saveServerIP()">保存 IP</button>
                    <div class="admin-meta">用于控制台与自动打开浏览器显示的地址；留空则自动检测网卡</div>
                    <hr style="margin: 10px 0; border: none; border-top: 1px solid #eee;">
                    <div>单文件上限: <strong id="current-max-file">-</strong> MB</div>
                    <div>上传目录总上限: <strong id="current-max-uploads">-</strong> MB</div>
                    <input type="number" id="new-max-file" placeholder="单文件上限 (MB)" style="width: 180px;">
                    <input type="number" id="new-max-uploads" placeholder="目录总上限 (MB)" style="width: 180px;">
                    <button class="success" onclick="adminAPI.saveFileLimits()">保存文件限制</button>
                    <div class="admin-meta">保存后立即生效；超出总量时自动清理最早上传的文件</div>
                </div>

                <div class="admin-section">
                    <h3>🏠 房间管理</h3>
                    <div style="margin-bottom: 10px;">
                        <input type="text" id="admin-room-id" placeholder="房间ID (2-20字符)">
                        <input type="text" id="admin-room-name" placeholder="房间名称 (可选)">
                        <select id="admin-room-visibility" aria-label="房间可见性" style="width: 100%; margin-bottom: 8px;"><option value="public">公开 · 用户主动加入</option><option value="private">私有 · 仅受邀用户</option></select>
                        <button class="success" onclick="adminAPI.createRoom()">创建房间</button>
                        <button class="secondary" onclick="adminAPI.loadRooms()">刷新</button>
                    </div>
                    <div id="admin-rooms-list">加载中...</div>
                </div>

                <div class="admin-section">
                    <h3>👥 账号管理</h3>
                    <button class="secondary" onclick="adminAPI.loadAccounts()">刷新</button>
                    <div id="admin-accounts-list">加载中...</div>
                </div>

                <div class="admin-section">
                    <h3>🟢 在线用户</h3>
                    <button class="secondary" onclick="adminAPI.loadOnline()">刷新</button>
                    <div id="admin-online-list">加载中...</div>
                </div>

                <div class="admin-section">
                    <h3>🔇 IP禁言管理</h3>
                    <input type="text" id="admin-ip-input" placeholder="IP地址">
                    <button class="danger" onclick="adminAPI.muteIP()">禁言IP</button>
                    <button class="success" onclick="adminAPI.unmuteIP()">解除禁言</button>
                    <div id="admin-muted-list"></div>
                </div>

                <div class="admin-section">
                    <h3>📢 广播消息</h3>
                    <textarea id="admin-broadcast" rows="3" style="width: 100%;" placeholder="输入广播内容..."></textarea>
                    <button onclick="adminAPI.broadcast()">发送广播</button>
                </div>
            </div><script src="/client/admin.js"></script></body></html>
