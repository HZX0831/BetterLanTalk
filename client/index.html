<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BetterLanTalk 内网聊天室</title><link rel="stylesheet" href="/client/login.css"><script defer src="/client/login.js"></script></head><body>    <div id="login-screen" class="login-form">
        <h1>BetterLanTalk</h1>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button id="tab-login" class="tab-btn active">登录</button>
            <button id="tab-register" class="tab-btn">注册</button>
        </div>

<input type="text" id="username-input" placeholder="请输入用户名 (2-20字符)" maxlength="20">
        <input type="password" id="password-input" placeholder="密码 (至少6位)">
        <input type="password" id="password2-input" placeholder="确认密码" class="hidden">

        <label style="display: block; text-align: left; margin: 8px 0; font-size: 14px; color: #555;">
            <input type="checkbox" id="remember-me" checked> 记住我（自动登录）
        </label>

        <button id="auth-button">登录</button>
        <div id="auth-error" style="color: #e74c3c; margin-top: 10px; font-size: 13px; min-height: 18px;"></div>

        <div class="server-info">每个 IP 只能使用一个账号，账号仅允许从关联 IP 登录。注册后加入默认聊天室。添加好友后可私聊，也可查找公开群。<br>Enter 换行 · Ctrl+Enter 发送 · Ctrl+V 上传图片</div></div></body></html>
